name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: purcell/setup-emacs@master
        with:
          version: '29.1'

      - name: Install tree-sitter grammars
        run: bin/install-grammars

      - uses: leotaku/elisp-check@master
        with:
          check: ert
          file: test/*.el
